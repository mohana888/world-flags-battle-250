<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD FLAGS BATTLE — 250</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307;color:#fff;font-family:Inter,system-ui,Arial}
#stage{position:relative;width:100vw;height:100vh;background:#020307}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:18px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:1000;letter-spacing:3px;text-shadow:0 0 25px #5ce1ff}
.live{font-weight:1000;color:#ff4353;letter-spacing:2px}
.pill{position:absolute;top:62px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:30px;background:#070c18d9;border:1px solid #243b5b;box-shadow:0 0 30px #0008;backdrop-filter:blur(8px);font-weight:800}
.stats{position:absolute;left:25px;top:75px;padding:10px 13px;background:#070c18d9;border:1px solid #1d304b;border-radius:12px;font-size:13px}
#leader{position:absolute;right:22px;top:105px;width:280px;max-height:65vh;overflow:hidden;padding:13px;background:#060a13c9;border:1px solid #1d304b;border-radius:16px;backdrop-filter:blur(10px)}
.row{display:grid;grid-template-columns:34px 1fr 38px;gap:7px;align-items:center;margin:5px 0;font-size:12px}.mini-flag{width:30px;height:20px;object-fit:cover;border-radius:2px;border:1px solid #71829a;box-shadow:0 1px 5px #0008}
.bar{height:4px;background:#18263b;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#64dcff}
.small{font-size:10px;color:#8da0ba}
.bottom{position:absolute;left:22px;right:22px;bottom:16px;display:flex;justify-content:space-between;align-items:end}
.help{font-size:12px;color:#98a9bf}
button{pointer-events:auto;border:0;border-radius:9px;padding:9px 14px;font-weight:900;background:#fff;color:#03060a}
#winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#0009}
#winner .box{padding:30px 55px;border:1px solid #4e6c91;border-radius:25px;background:#07101de8;box-shadow:0 0 100px #000}
#winner .flag{font-size:100px}.champ{font-size:46px;font-weight:1000}.sub{color:#9fb0c9;margin-top:8px}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="1800" height="1000"></canvas>
<div id="hud">
<div class="top"><div class="logo">🌍 WORLD FLAGS BATTLE</div><div class="live">● LIVE</div></div>
<div id="event" class="pill">Loading 250 flags...</div>
<div id="stats" class="stats">250 / 250 SURVIVING</div>
<div id="leader"></div>
<div class="bottom"><div class="help">⚽ EACH FLAG MOVES INDEPENDENTLY • SOLID WALL = BOUNCE • 🟡 GAP = EXIT • OUTSIDE = ELIMINATED</div><button id="reset">NEW BATTLE</button></div>
</div>
<div id="winner"><div class="box"><div id="winnerFlag" class="flag"></div><div id="winnerName" class="champ"></div><div class="sub">WORLD FLAGS BATTLE CHAMPION</div><button id="again" style="margin-top:18px">BATTLE AGAIN</button></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
</body>
</html>
